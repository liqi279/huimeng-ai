# Render 部署配置 - 绘梦 AI 后端
# 使用方法：在 Render.com 仪表盘选择 "Blueprint" 导入本仓库即可
services:
  - type: web
    name: huimeng-ai-backend
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node src/index.js
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      # Render 自带 HTTPS 终端，关闭自签 HTTPS 服务器，避免绑定 8443 端口失败
      - key: HTTPS
        value: "off"
      # RayinAI 代理通用配置（GPT-image / Gemini Banana 共用）
      - key: RAYIN_BASE
        value: "https://www.rayinai.com/v1"
      - key: RAYIN_KEY
        value: "sk-e77e0766df2fe8a27a5eb19b0f4e4c97c604334e1ffeafc72bb55da70f14eb38"
      # Gemini Banana 生图模型配置（用户指定）
      - key: GEMINI_BASE_URL
        value: "https://www.rayinai.com/v1"
      - key: GEMINI_API_KEY
        value: "sk-e77e0766df2fe8a27a5eb19b0f4e4c97c604334e1ffeafc72bb55da70f14eb38"
      - key: GEMINI_MODEL
        value: "gemini-3.1-flash-image"
      # GPT-image 也走 RayinAI + Gemini 模型（用户账号下的可用模型）
      - key: GPT_MODEL
        value: "gemini-3-pro-image"
    healthCheckPath: /api/health
    autoDeploy: true
