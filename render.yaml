# Render 部署配置 - 绘梦 AI 后端
# 使用方法：在 Render.com 仪表盘选择 "Blueprint" 导入本仓库即可
services:
  - type: web
    name: huimeng-ai-backend
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node src/index.js
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      # Render 自带 HTTPS 终端，关闭自签 HTTPS 服务器，避免绑定 8443 端口失败
      - key: HTTPS
        value: "off"
      # RayinAI 代理 —— 两套 key 共用同一个 base URL
      # Key 1: OpenAI 图像模型 → /images/generations
      - key: OPENAI_KEY
        value: "sk-9205aabaca73ce33821e254186977ac65181acee9d322042d595c696e6400747"
      # Key 2: Gemini 图像模型 → /chat/completions
      - key: GEMINI_KEY
        value: "sk-e77e0766df2fe8a27a5eb19b0f4e4c97c604334e1ffeafc72bb55da70f14eb38"
      # 默认模型
      - key: GPT_MODEL
        value: "gpt-image-2.5-flare"
      - key: BANANA_MODEL
        value: "gemini-3.1-flash-image"
      # 外部 PostgreSQL 连接串（解决 Render 免费层重启清空 data/ 目录导致数据丢失）
      # 推荐使用 Neon (https://neon.tech) 免费 PostgreSQL，连接串格式：
      #   postgresql://user:password@host/dbname?sslmode=require
      # 设置后用户/作品/桌面/资产全部存入外部数据库，Render 重启不再丢数据；
      # 不设置则回退到本地 JSON 文件（data/ 目录，免费层重启会清空）。
      - key: DATABASE_URL
        value: ""
    healthCheckPath: /api/health
    autoDeploy: true
