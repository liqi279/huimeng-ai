name: Validate standalone Dimverse entry

on:
  push:
    branches:
      - fix/dimverse-direct-entry

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Run regression tests
        run: npm test --prefix server
      - name: Check JavaScript syntax
        run: |
          node --check frontend/dimverse.js
          node --check deploy/assets/hm-s29-b9fa10c0.js
      - name: Validate Pages artifact
        run: npm run build
