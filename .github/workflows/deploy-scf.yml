name: Deploy backend to Tencent SCF

# server/ 有改动就自动打包并更新云函数，复用 server/scripts/scf-deploy.js 的
# 快照 → 打包 → 上传 COS → UpdateFunctionCode → 五步自检 全流程。
# 只从仓库 Secrets 读取 CAM 密钥，日志里不会回显。
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-scf.yml'
  workflow_dispatch:

# 发布是幂等覆盖，但不要中途取消（避免 UpdateFunctionCode 进行到一半被打断）
concurrency:
  group: scf-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # 打包脚本调用 powershell.exe，用 Windows runner 才能原样复用
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
        # 后端需要 node_modules：既供打包复用，也让发布前的 DB 快照可用

      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Deploy to SCF
        working-directory: server
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          SCF_FUNCTION: ${{ vars.SCF_FUNCTION }}
          SCF_NAMESPACE: ${{ vars.SCF_NAMESPACE }}
          API_BASE: ${{ vars.API_BASE }}
          EXPECT_BOOKS: ${{ vars.EXPECT_BOOKS }}
        run: node scripts/scf-deploy.js
