name: Validate isolated repair branch

on:
  push:
    branches:
      - fix/download-source-whitelist

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run server regression tests
        run: npm test --prefix server

      - name: Check JavaScript syntax
        run: |
          node --check frontend/dimverse.js
          node --check server/src/index.js
          node --check server/src/download-source.js

      - name: Validate GitHub Pages artifact
        run: npm run build
