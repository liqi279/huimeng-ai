name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend bundle from canonical sources
        run: |
          node scripts/build-deploy.js
          npm run build

      - name: Install COS upload dependencies
        run: npm ci --prefix server --omit=dev --no-audit --no-fund

      - name: Publish PDF.js assets to Tencent COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET || 'huimeng-1527498271' }}
          COS_REGION: ${{ vars.COS_REGION || 'ap-guangzhou' }}
        run: node server/scripts/upload-pdfjs-assets.js

      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate and export Godot Web game
        run: |
          godot --headless --path game/dimverse-godot --editor --quit
          mkdir -p deploy/dimverse/game
          godot --headless --path game/dimverse-godot --export-release "Web" "$GITHUB_WORKSPACE/deploy/dimverse/game/index.html"
          test -s deploy/dimverse/game/index.html
          test -s deploy/dimverse/game/index.wasm
          test -s deploy/dimverse/game/index.pck

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: deploy

      - name: Wait for Pages artifact registration
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
