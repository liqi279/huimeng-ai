name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend bundle
        run: npm run build

      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate and export Godot Web game
        run: |
          godot --headless --path game/dimverse-godot --editor --quit
          mkdir -p deploy/dimverse/game
          godot --headless --path game/dimverse-godot --export-release "Web" "$GITHUB_WORKSPACE/deploy/dimverse/game/index.html"
          test -s deploy/dimverse/game/index.html
          test -s deploy/dimverse/game/index.wasm
          test -s deploy/dimverse/game/index.pck

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
