<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="次元宇宙 · 绘梦 AI 创作世界">
  <title>次元宇宙 · 绘梦</title>
  <link rel="icon" href="../favicon.ico">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070b18; }
    .universe { display: block; width: 100%; height: 100%; border: 0; background: #070b18; }
    .loading { position: fixed; inset: 0; display: grid; place-items: center; color: #a5b4fc; font: 14px/1.6 system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div class="loading" aria-hidden="true">正在连接次元宇宙…</div>
  <iframe class="universe" title="次元宇宙" src="../?view=dimverse" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <script>
    const frame = document.querySelector('.universe');
    frame.addEventListener('load', () => {
      document.querySelector('.loading').remove();
    });
  </script>
</body>
</html>
